name: Crawl The Rehearsal Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

concurrency:
  group: rehearsal-archive-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source crawler
        run: python crawler.py
        env:
          CRAWL_MAX_PAGES: "40"
          CRAWL_DELAY_SECONDS: "3"
      - name: Check subtitle listing availability
        run: python check_subtitle_sources.py
        env:
          CRAWL_DELAY_SECONDS: "3"
      - name: Commit catalog updates
        run: |
          if [[ -n "$(git status --porcelain data/catalog.json data/season2_subtitles.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json data/season2_subtitles.json
            git commit -m "Update Rehearsal source catalog"
            git push
          else
            echo "Catalog unchanged."
          fi
